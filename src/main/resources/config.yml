# ==========================================================
#                          Beacons
# ==========================================================
#Enables the increased beacon radius
Enable-Beacon-Changes: true
# How it scales based on your modifier value:
#   Tier 1 (1 layer)  = 2x Modifier Value
#   Tier 2 (2 layers) = 3x Modifier Value
#   Tier 3 (3 layers) = 4x Modifier Value
#   Tier 4 (4 layers) = 5x Modifier Value
#
# Examples:
#   If set to 30: Tier 1 = 60 blocks, Tier 2 = 90,  Tier 3 = 120, Tier 4 = 150 (Recommended Max)
#   If set to 20: Tier 1 = 40 blocks, Tier 2 = 60,  Tier 3 = 80,  Tier 4 = 100
#   If set to 10: Tier 1 = 20 blocks, Tier 2 = 30,  Tier 3 = 40,  Tier 4 = 50  (Vanilla Ranges)
# ============================================================================
Beacon-Range-Modifier: 30

# ==========================================================
#                       Warps
# ==========================================================
Enable-Warps: false

# ==========================================================
#                       Chunk loading
# ==========================================================
#If this is enabled Offline chunk loading will be enabled (players can use a command to keep an area active for farms or other usages)
Enable-Offline-Chunk-Loading: false

# ==========================================================
#                       Heads/Mini Blocks
# ==========================================================
#if this is enabled if a player gets killed they drop their player head
Enable-Players-Drop-Head: true
#if this is enabled you can get a small version of a block using a stonecutter
Enable-Mini-Blocks: true

# ==========================================================
#                       Pick block from shulkerbox
# ==========================================================
# Enable quick-pull access from off-hand Shulker Boxes
# When true: Placing a Shulker Box from the off-hand against a block
# will automatically pull that block type from the Shulker into the main hand.
Enable-Pick-Block-From-Shulker: true

# ==========================================================
#                       Tool Protection msg's
# ==========================================================
Enable-Tool-Protection: true

# ==========================================================
#                       Hardened PickAxe
# ==========================================================
#If this is enabled you can craft a hardened pickaxe which can instamine deepslate when with haste 2
Enable-Hardened-PickAxe: false
#Recipe
# NETHER_STAR , NETHERITE_INGOT , NETHER_STAR
# NETHERITE_INGOT , NETHERITE_PICKAXE , NETHERITE_INGOT
# NETHER_STAR , NETHERITE_INGOT , NETHER_STAR

#DONT CHANGE THIS VALUE
Hardened-Pickaxe-Ever-Used: false

# ==========================================================
#                       Villagers
# ==========================================================
#If this is set to true the best price ever shown to a player by this villager, Wil become the new global standard for this villager for all players.
Enable-Global-Villager-Pricing: false

# ==========================================================
# HORROR SETTINGS
# ==========================================================
# If set to true, the plugin will occasionally play ghost sounds,
# spawn fake entities, and send 'creepy' messages to random players.
# This is a purely cosmetic psychological horror feature.
Enable-Creepy-Stuff: false

# ==========================================================
# CUSTOM RECIPE CONFIGURATION
# ==========================================================
# 1. 'Result' must be a valid Minecraft Material name.
# 2. 'Shape' is a 3x3 grid. Each line is one row of the crafting table.
# 3. 'Ingredients' maps the letters in your shape to items.
# 4. Use " " for empty slots, Aka just use a space.
# ==========================================================
#If this is enabled the Custom-Recipes below wil be injected into the game
Enable-Custom-Recipes: true

Custom-Recipes:
    Explanation-ITEM: # <--- This name you can set this to whatever aslong as it's not the same as wats already used in other items, for now its Explanation-ITEM because this item is for explaination.
        Result: "DIRT" # <--- The item you want crafted with your new recipe.
        Amount: 1 #<--- The amount you get in game.
        Display-Name: "&6The Holy Dirt of the Void" # <--- Custom Name! (Supports & color codes). if nothing is set here it wil use the default in game name.
        Player-Head-Name: #<--- if there is a player name here it wil create a player head named this, for heads the result must be set to PLAYER_HEAD
        # Visual Guide:
        #  [Slot A] [Slot A] [Slot A]
        #  [Slot B] [Slot C] [Slot B]
        #  [Slot D] [Slot D] [Slot D]
        Shape:
            - "ABC"
            - "DEF"
            - "GHI"
        # Define what each letter represents (up to 9 unique items) for an empty slot use AIR.
        Ingredients:
            A: "NETHERITE_BLOCK"
            B: "DIAMOND_BLOCK"
            C: "EMERALD_BLOCK"
            D: "NETHER_STAR"
            E: "DRAGON_EGG"
            F: "BEACON"
            G: "DRAGON_BREATH"
            H: "TOTEM_OF_UNDYING"
            I: "ENCHANTED_GOLDEN_APPLE"

