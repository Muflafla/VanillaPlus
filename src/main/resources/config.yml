# VanillaPlus Configuration
#Do not change this version number!
Config-Version: "1.0.4"

# ==========================================================
#               Login msg's and fireworks
# ==========================================================
#Will launch some fireworks where player spawned. (can lagg on lesser hardware)
Enable-Login-Fireworks: true
#Set this to false to disable login messages.
Show-Login-Messages: true
#Set your own login Massages.
Login-Messages:
    - "§aWelcome to the server! %s"
    - "§aHello there %s"

#Set this to false to disable Player specific login messages.
Show-Player-Specific-Login-Messages: true

#Here we can set custom messages.
Custom-Player-Messages:
    muflafla: #<-- this is for my acc for show, You can delete it if u want.
        Player-UUID: "bbdf8cf3-020e-4367-96eb-52e459388de9"
        Custom-Messages:
            - "§aWelcome"
            - "§aHere again?"

# ==========================================================
#               Player Sleep
# ==========================================================
#If this is enabled you can set the amount of players by player/percentage for night skip to trigger
Enable-Custom-Sleep: true
#if this is enabled all players will have there TIME_SINCE_REST set to 0 when the night is skipped
All-Players-Rest: true
#When sleep mode is set to FIXED it's a per player trigger else if it's set to PERCENTAGE its per percentage of players to trigger night skip
Sleep-Mode : "FIXED"
#Set the amount/percent of player for it to trigger night skip
Sleep-Requirement: 1
#Enable this to show the amount of players needed to trigger sleep as an Actionbar msg
ActionBar-Player-Message: true
#Night skip msg if left blank no msg will appear
Night-Skipped-Message : "§aThe night has been skipped!"
# Set when player wakes up.
# Common Choices:
#  23000 - Early Twilight Wake (5:00 AM)
#  0     - Default Minecraft Dawn (6:00 AM)
#  1000  - Late Morning Wake (7:00 AM)
Player-Wake-Time: 0
# If true, sleeping will clear rain and thunder (Vanilla behavior). If false, the weather will stay exactly as it was.
Clear-Weather-On-Sleep: true

# ==========================================================
#               Mystical Stash
# ==========================================================
#This enables use of the Mystical Stash
Enable-Mystical-Stash: true
#If this is enabled every player gets a book to access their stash / if disabled this you can only use a command to access the stash
Enable-Mystical-Stash-Book: true
#Set a name for your stashes default = Mystical Stash (MC color codes like §5 can also be used)
Stash-Name: "§5Mystical Stash"
#This enables the use of a chest named Mystical Stash to open your stash
Enable-Mystical-Stash-Chests: true
#The number of rows in the stash inventory. Each row contains 9 slots.
#Because Minecraft uses a "Rule of 9," each row adds 9 slots.
#Example: 6 rows = 54 total items (AKA a large chest)
#Stash-Rows must be a whole number between 1 and 6.
#WARNING: Do not reduce this number after players have already stored items.
#Reducing the size will "hide" items in higher slots until the value is increased again.
Stash-Rows: 6
#If this is enabled you drop your stash items upon death
Enable-Drop-Stash-On-Death: false
#If this is enabled items on the ground wil go into your stash if the inv is full. If this is enabled players can still enable or disable this for them self.
Enable-Stash-Overflow: true

# ==========================================================
#                   AUTO BAN FEATURE
# ==========================================================
#If this is enabled it will automatically ban anyone that joins that was not on the whitelist, So they'll be instantly greeted with a ban screen when trying to join.
Ban-On-Join: true
Ban-Reason: "You where not whitelisted"

# ==========================================================
#                   creepers/enderman/phantoms/ghast
# ==========================================================
#If this is enabled phantoms wont spawn at all
Disable-Phantom-Spawn: false

#If this is enabled Ghast fireballs won't explode at all.
Disable-Ghast-Explosions: false
#If this is enabled it wil stop Ghast from blowing up blocks, but it wil still damage players.
Disable-Ghast-Block-Damage: false
#If this is enabled and a Ghast fireball explodes it will still damage the player and blow up blocks but give all the block back.
Ghast-Gives-all-Blocks: true

#If this is enabled creepers don't spawn at all
Disable-Creeper-Spawn: false
#If this is enabled creepers won't explode at all.
Disable-Creeper-Explosions: false
#If this is enabled it wil stop creepers from blowing up blocks, but it wil still damage players.
Disable-Creeper-Block-Damage: false
#If this is enabled and a creeper explodes it will still damage the player and blow up blocks but give all the block back.
Creeper-Gives-all-Blocks: true

#If this is enabled it wil stop enderman from picking up blocks
Stop-Enderman-From-Griefing: true
#Set this to false to stop the Enderman messages from showing up.
Show-Enderman-Messages: true
